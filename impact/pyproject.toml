[project]
name = "impact"
version = "0.1.0"
description = "Pre-change advisory for the NetCortex stack: assess a proposed Change against existing evidence and write an Impact Report"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
impact = "impact.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["impact"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
